[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-sim"
version = "1.0.0"
description = "Reproducible industrial process monitoring and simulation"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
plant-sim = "plant_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
